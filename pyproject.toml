[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "F-SOCIETY"
version = "2.1.0"
description = "Bot Discord em PT-BR com central de configuração, tickets e música"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "discord.py[voice]==2.7.1",
    "aiohttp>=3.11,<4",
    "pymongo[srv]>=4.10,<5",
    "PyNaCl>=1.5,<1.6",
    "davey>=0.1.6,<0.2",
    "yt-dlp>=2025.1.15",
    "imageio-ffmpeg>=0.6,<1",
]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Portuguese (Brazilian)",
    "Framework :: AsyncIO",
]

[project.scripts]
fsociety = "bot:main"

[tool.setuptools]
py-modules = ["bot", "control_panel", "tickets", "start", "cve_alerts", "music_system"]
