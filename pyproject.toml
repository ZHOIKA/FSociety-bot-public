[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "F-SOCIETY"
version = "2.1.0"
description = "Bot Discord em PT-BR com painel, tickets, CVE, comunidade e CTI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "discord.py==2.7.1",
    "aiohttp>=3.11,<4",
]
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Portuguese (Brazilian)",
    "Framework :: AsyncIO",
]

[project.scripts]
fsociety = "bot:main"

[tool.setuptools]
py-modules = [
    "bot",
    "control_panel",
    "tickets",
    "cve_alerts",
    "darkweb_watch",
    "start",
]
